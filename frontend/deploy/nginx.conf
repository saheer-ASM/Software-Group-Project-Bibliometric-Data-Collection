# Nginx config for serving the ScholarMetrics React build (single-page app).
#
# - Real files (JS/CSS/images) are served directly.
# - Every other path (/dashboard, /settings, /data-explorer?author=..., ...) is
#   answered with index.html, so refreshing or opening a deep link never 404s;
#   React Router then shows the right page.
# - /api/ is proxied to the Node backend and is NEVER rewritten to index.html.
#
# Build first:  cd frontend && npm run build   (copy build/ to the root below)

server {
    listen 80;
    server_name _;                      # set your domain

    root /usr/share/nginx/html;         # contents of frontend/build
    index index.html;

    # Backend API (Express, default port 5005). Remove this block if the
    # frontend calls the API on a different host via REACT_APP_API_URL.
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build assets: cache for a year, 404 if missing.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for all app routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch the latest index.html so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
