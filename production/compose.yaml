# Production stack for ScholarMetrics.
#
#   Internet -> Cloudflare Tunnel -> nginx :80 -> frontend | backend -> PostgreSQL
#
# Run from the REPOSITORY ROOT; all values come from production/.env:
#
#   docker compose --env-file production/.env -f production/compose.yaml up -d --build
#
# PostgreSQL is a REMOTE AWS server and is deliberately NOT a service here. The
# backend container dials it directly over the internet; it is never routed
# through nginx or the Cloudflare Tunnel.
#
# Only `nginx` publishes a host port. frontend and backend are reachable solely
# over the internal `appnet` bridge, by service name.

name: scholarmetrics-prod

services:

  # ------------------------------------------------------------------ nginx
  # The single entry point. Cloudflare Tunnel connects here and nowhere else.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 on purpose: cloudflared runs on this PC and reaches
      # it over loopback, so the app is never exposed to the LAN or the public
      # interface. Change to "80:80" only if something off-box must reach nginx
      # directly -- that is a deliberate widening of the attack surface.
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - appnet

  # --------------------------------------------------------------- frontend
  # Static CRA build served by its own nginx. No host port: only the edge
  # nginx talks to it, as http://frontend:80 on appnet.
  frontend:
    build:
      context: ..
      dockerfile: production/frontend.Dockerfile
      args:
        # Empty => the bundle calls the relative path /api/..., same-origin
        # through nginx. Do not set an absolute URL here.
        REACT_APP_API_URL: ""
        # Firebase WEB app config. These are public client identifiers by
        # design (they ship in every Firebase web app) and are safe in the
        # bundle. Access is controlled by Firebase security rules, not secrecy.
        REACT_APP_FIREBASE_API_KEY: ${REACT_APP_FIREBASE_API_KEY}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${REACT_APP_FIREBASE_AUTH_DOMAIN}
        REACT_APP_FIREBASE_PROJECT_ID: ${REACT_APP_FIREBASE_PROJECT_ID}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${REACT_APP_FIREBASE_STORAGE_BUCKET}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${REACT_APP_FIREBASE_MESSAGING_SENDER_ID}
        REACT_APP_FIREBASE_APP_ID: ${REACT_APP_FIREBASE_APP_ID}
    restart: unless-stopped
    networks:
      - appnet

  # ---------------------------------------------------------------- backend
  # Express. No host port: reachable only as http://backend:5005 on appnet.
  backend:
    build:
      context: ..
      dockerfile: production/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5005
      # Required in a container. backend/server.js previously bound to
      # 'localhost', which inside a container is the container's own loopback
      # and would make nginx unable to reach it.
      HOST: 0.0.0.0

      # --- PostgreSQL: remote AWS server, outside this stack -----------
      # Names match backend/config/database.js exactly -- no renaming, no
      # production-only aliases. Values come from production/.env.
      DB_HOST: ${DB_HOST:?DB_HOST must be set in production/.env}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Empty => config/database.js uses TLS with rejectUnauthorized:false,
      # which is what the remote AWS instance expects. "disable" would turn TLS
      # off and should only ever be used for a database on this machine.
      DB_SSLMODE: ${DB_SSLMODE-}

      # --- auth tokens ------------------------------------------------
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the root .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # --- Firebase Admin (server-side, NEVER given to the frontend) ---
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}

      # --- CORS -------------------------------------------------------
      # Same-origin through nginx means CORS is mostly bypassed, but fetch()
      # still sends Origin on POST, and the original allow-list only accepted
      # http://localhost:<port> -- which would reject your real domain.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      # /api/health is defined in server.js and returns 503 when the remote
      # PostgreSQL or Firebase Admin is unreachable, so nginx only starts once
      # the backend can actually serve requests.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5005/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
