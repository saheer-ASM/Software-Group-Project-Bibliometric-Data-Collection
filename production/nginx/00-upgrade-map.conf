# Maps used by default.conf. These must live in the http{} block, which is what
# /etc/nginx/conf.d/*.conf is included into. The 00- prefix just keeps them
# visually first; nginx resolves maps regardless of file order.

# WebSocket upgrade passthrough. The app uses no WebSockets today (nothing
# imports socket.io or opens a ws:// connection), but this is inert for plain
# HTTP and saves a debugging session if one is ever added.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The visitor's real address. Requests arrive from cloudflared on this PC, so
# $remote_addr is the tunnel, not the visitor; Cloudflare puts the visitor's IP
# in CF-Connecting-IP (and overwrites any value a client sends). Trusting the
# header is safe only because nginx is published on 127.0.0.1 alone -- nothing
# but the local cloudflared can reach it. Falls back to $remote_addr for
# requests that do not come through Cloudflare (e.g. a local curl).
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# Per-visitor request rate for /api/, enforced before anything reaches Node.
# 10 r/s sustained with the burst set in default.conf: well above what the
# pages send, far below what it takes to keep the backend busy.
limit_req_zone $client_ip zone=api_per_ip:10m rate=10r/s;
limit_req_status 429;

# Cloudflare terminates TLS and forwards plain HTTP over the tunnel, so the
# browser's real scheme arrives in X-Forwarded-Proto, not $scheme. The header
# is believed only on requests that came through Cloudflare (CF-Connecting-IP
# set; Cloudflare overwrites both headers), and only when it is exactly "http"
# or "https". Anything else -- a request that did not come through Cloudflare,
# or a made-up value -- gets nginx's own $scheme, so a client can never choose
# what the backend is told.
map "$http_cf_connecting_ip|$http_x_forwarded_proto" $forwarded_proto {
    default            $scheme;
    "~^[^|]+\|https$"  https;
    "~^[^|]+\|http$"   http;
}
