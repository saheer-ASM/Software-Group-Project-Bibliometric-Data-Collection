# Maps used by default.conf. These must live in the http{} block, which is what
# /etc/nginx/conf.d/*.conf is included into. The 00- prefix just keeps them
# visually first; nginx resolves maps regardless of file order.

# WebSocket upgrade passthrough. The app uses no WebSockets today (nothing
# imports socket.io or opens a ws:// connection), but this is inert for plain
# HTTP and saves a debugging session if one is ever added.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare terminates TLS and forwards plain HTTP over the tunnel, so the
# browser's real scheme arrives in X-Forwarded-Proto, not $scheme. Falls back
# to $scheme when the header is absent (e.g. hitting nginx directly on :80).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
