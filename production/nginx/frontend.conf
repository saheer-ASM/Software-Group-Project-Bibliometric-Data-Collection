# nginx INSIDE the frontend container. Serves the Create React App build only.
# It has no /api/ block: API routing is the edge nginx's job (default.conf).
# This container publishes no host port -- only the edge nginx reaches it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trust the edge proxy's forwarded client IP for this container's logs --
    # but only from the private Docker network (appnet, where the edge nginx
    # is), never from anyone who sends an X-Forwarded-For header.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Fingerprinted CRA assets: immutable, safe to cache for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy is invisible to returning
    # browsers still holding the old asset references.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # React Router: any unknown path is an app route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
