# Edge nginx -- the ONLY container with a published host port, and the only
# thing Cloudflare Tunnel talks to.
#
#   /         -> frontend container (static CRA build)
#   /api/...  -> backend container  (Express)
#
# Upstreams are addressed by Docker Compose service name over the internal
# network. Never localhost here: inside this container localhost is nginx itself.

server {
    listen 80;
    server_name _;

    # $forwarded_proto and $connection_upgrade are defined by the maps in
    # 00-upgrade-map.conf (a map is the correct tool here; `if` inside a server
    # block is the classic nginx footgun).

    # Do not advertise the nginx version on errors.
    server_tokens off;

    # ------------------------------------------------------- security headers
    # Set once here, for every response of the site (pages and API alike);
    # `always` covers error responses too. The locations below inherit these
    # only while they have no add_header of their own -- keep it that way.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Browsers honour this only over HTTPS (the Cloudflare side), never on
    # plain http://localhost.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # What a page may load:
    # - scripts: the app's own bundle only (the frontend image is built with
    #   INLINE_RUNTIME_CHUNK=false, so index.html has no inline script), plus
    #   Google's helpers for Firebase sign-in pop-ups and reCAPTCHA;
    # - styles: the bundle, Google Fonts, and inline style attributes (React and
    #   Recharts set them); fonts: the bundle and Google Fonts;
    # - connections: this site's /api and Firebase (Auth, Firestore);
    # - frames: Firebase's sign-in iframe and Google sign-in / reCAPTCHA;
    # - images: any https source (the dashboard's field photos are external);
    # - nothing may frame this site (frame-ancestors), no plugins (object-src).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://apis.google.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Docker's embedded DNS. Without this, nginx resolves a service name ONCE at
    # startup and caches the container IP forever -- so every `up -d --build`
    # gives the frontend/backend a new IP and nginx 502s against the dead one
    # until it is restarted. Re-resolving every 10s keeps it correct.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The API accepts JSON bodies only; 2m is generous and caps abuse.
    client_max_body_size 2m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------------- API
    # Trailing slash deliberately omitted from proxy_pass so the full original
    # path is preserved: /api/auth/login must arrive at Express as
    # /api/auth/login, because the routes are mounted at app.use('/api/auth').
    location /api/ {
        # The upstream MUST be a variable: that is what defers resolution to
        # request time and makes the resolver above take effect. $request_uri is
        # then required, because a proxy_pass with variables no longer passes
        # the original URI automatically.
        set $backend_host backend:5005;
        proxy_pass http://$backend_host$request_uri;

        limit_req zone=api_per_ip burst=50 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # $client_ip (00-upgrade-map.conf) is the visitor, not cloudflared.
        # X-Forwarded-For is REPLACED, not appended to: a client-sent value
        # would otherwise let anyone pick the address Express rate-limits on.
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # The first author, comparison or stats query after a start reads the
        # SQLite file from disk through Docker's bind mount, which can take
        # tens of seconds; 120s leaves headroom without hanging forever.
        # (Cloudflare's own limit for a response is 100s.)
        proxy_read_timeout    120s;

        proxy_buffering on;
    }

    # ---------------------------------------------------------------- app
    location / {
        set $frontend_host frontend:80;
        proxy_pass http://$frontend_host$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
