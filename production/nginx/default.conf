# Edge nginx -- the ONLY container with a published host port, and the only
# thing Cloudflare Tunnel talks to.
#
#   /         -> frontend container (static CRA build)
#   /api/...  -> backend container  (Express)
#
# Upstreams are addressed by Docker Compose service name over the internal
# network. Never localhost here: inside this container localhost is nginx itself.

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    # Express listens on 5005 (PORT in backend/server.js, set in compose).
    server backend:5005;
}

server {
    listen 80;
    server_name _;

    # $forwarded_proto and $connection_upgrade are defined by the maps in
    # 00-upgrade-map.conf (a map is the correct tool here; `if` inside a server
    # block is the classic nginx footgun).

    # Do not advertise the nginx version on errors.
    server_tokens off;

    # The API accepts JSON bodies only; 2m is generous and caps abuse.
    client_max_body_size 2m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------------- API
    # Trailing slash deliberately omitted from proxy_pass so the full original
    # path is preserved: /api/auth/login must arrive at Express as
    # /api/auth/login, because the routes are mounted at app.use('/api/auth').
    location /api/ {
        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # Author comparison and stats queries hit PostgreSQL over several
        # tables; 60s leaves headroom for a cold query without hanging forever.
        proxy_read_timeout    60s;

        proxy_buffering on;
    }

    # ---------------------------------------------------------------- app
    location / {
        proxy_pass http://frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
